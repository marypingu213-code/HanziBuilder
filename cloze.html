<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HanziBuilder - 生字情境學習單</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=LXGW+WenKai+TC&display=swap">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; }
        .kai { font-family: "BiauKai", "DFKai-SB", "TW-Kai", "KaiTi", "LXGW WenKai TC", serif; }
        body { height: 100vh; height: 100dvh; }
        #controlPanel { min-height: 0; min-width: 0; }
        #editorPanel { min-height: 0; }
        #previewWrapper { min-width: 0; min-height: 0; }
        @media (max-width: 767px) {
            body { height: auto; min-height: 100dvh; overflow: auto; }
            #controlPanel { height: auto; }
            #editorPanel { overflow: visible; }
            #previewWrapper { overflow: visible; }
        }
        .page-preview canvas { width: 100%; height: auto; display: block; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-100 h-screen overflow-hidden flex flex-col md:flex-row">

    <!-- 左側：控制面板 -->
    <div id="controlPanel" class="w-full md:w-[46%] lg:w-[42%] bg-white shadow-xl flex flex-col h-full z-10">
        <div class="p-4 bg-indigo-700 text-white shadow-md z-20 flex justify-between items-center gap-2">
            <div>
                <h1 class="text-xl font-bold tracking-wider">生字情境學習單</h1>
                <p class="text-xs text-indigo-200 mt-1">看部件寫生字 → 讀句子填生字</p>
            </div>
            <a href="./index.html" class="text-xs font-bold bg-indigo-600 hover:bg-indigo-500 border border-indigo-400 px-3 py-2 rounded shadow whitespace-nowrap">← 部件標籤產生器</a>
        </div>

        <div id="editorPanel" class="p-4 flex-1 overflow-y-auto space-y-4">

            <!-- 1. 課次 -->
            <div class="bg-violet-50 p-3 rounded-lg border border-violet-200 shadow-sm">
                <label for="lessonSelect" class="block text-sm font-bold text-violet-900 mb-2">📚 1. 選擇課次生字</label>
                <select id="lessonSelect" class="w-full p-2 border border-violet-300 rounded-md bg-white font-bold focus:ring-violet-500"></select>
                <div id="manualBox" class="mt-2 hidden">
                    <label for="manualChars" class="block text-xs font-bold text-violet-800 mb-1">手動輸入生字（每行一字，可加部件：<span class="kai">困=囗+木</span>）</label>
                    <textarea id="manualChars" rows="4" class="kai w-full p-2 border border-violet-300 rounded-md bg-white text-lg" placeholder="困=囗+木&#10;震=雨+辰&#10;傲"></textarea>
                </div>
                <div id="charChips" class="flex flex-wrap gap-2 mt-3"></div>
                <div class="flex items-center justify-between gap-2 mt-3">
                    <p id="sourceNote" class="text-[10px] text-violet-700 leading-relaxed"></p>
                    <label class="shrink-0 bg-white hover:bg-violet-100 text-violet-800 border border-violet-300 text-xs font-bold py-1.5 px-3 rounded shadow-sm cursor-pointer">⬆ 匯入備份檔<input type="file" id="backupFileInput" accept="application/json,.json" class="hidden"></label>
                </div>
            </div>

            <!-- 2. 句子 -->
            <div class="bg-amber-50 p-3 rounded-lg border border-amber-200 shadow-sm">
                <div class="flex items-center justify-between gap-2 mb-2">
                    <label for="passageInput" class="block text-sm font-bold text-amber-900">📖 2. 情境句子（約 50 字）</label>
                    <span id="passageCount" class="text-[11px] font-bold text-amber-800 bg-white border border-amber-200 px-2 py-0.5 rounded-full">0 字</span>
                </div>
                <textarea id="passageInput" rows="6" class="kai w-full p-3 border border-amber-300 rounded-md bg-white text-lg leading-relaxed focus:ring-amber-500" placeholder="寫一段包含本課生字的句子，生字會自動變成填空格。"></textarea>
                <div id="coverage" class="flex flex-wrap gap-1.5 mt-2"></div>
                <div class="text-[11px] text-amber-800 leading-relaxed mt-2 space-y-1">
                    <p>・句子裡出現的本課生字會<b>自動挖空</b>，不用另外標記。每一課的句子會分開保存。</p>
                    <p>・想多挖其他字，用全形【】框起來，例如【勇】【敢】。不想挖空某個生字時，在它前面加 \，例如 \困。</p>
                </div>
            </div>

            <!-- 3. 選項 -->
            <div class="bg-sky-50 p-3 rounded-lg border border-sky-200 shadow-sm">
                <label class="block text-sm font-bold text-sky-900 mb-2">⚙️ 3. 版面選項</label>
                <div class="grid grid-cols-2 gap-2 text-sm">
                    <label class="flex items-center gap-2 bg-white border border-sky-200 rounded px-2 py-2 cursor-pointer"><input type="checkbox" id="optWriteHint" checked class="w-4 h-4 accent-indigo-600"> 寫生字格有淡字</label>
                    <label class="flex items-center gap-2 bg-white border border-sky-200 rounded px-2 py-2 cursor-pointer"><input type="checkbox" id="optColor" checked class="w-4 h-4 accent-indigo-600"> 部件彩色</label>
                    <label class="flex items-center gap-2 bg-white border border-sky-200 rounded px-2 py-2 cursor-pointer"><input type="checkbox" id="optBank" checked class="w-4 h-4 accent-indigo-600"> 句子上方顯示字詞庫</label>
                    <label class="flex items-center gap-2 bg-white border border-sky-200 rounded px-2 py-2 cursor-pointer"><input type="checkbox" id="optHints" class="w-4 h-4 accent-indigo-600"> 填空格淡色部件</label>
                    <label class="flex items-center gap-2 bg-white border border-sky-200 rounded px-2 py-2 cursor-pointer"><input type="checkbox" id="optPractice" class="w-4 h-4 accent-indigo-600"> 最後加仿寫練習格</label>
                    <label class="flex items-center gap-2 bg-white border border-sky-200 rounded px-2 py-2 cursor-pointer"><input type="checkbox" id="optAnswer" class="w-4 h-4 accent-rose-600"> <span class="text-rose-700 font-bold">答案版</span></label>
                    <label class="flex items-center gap-2 bg-white border border-sky-200 rounded px-2 py-2 cursor-pointer"><input type="checkbox" id="optIndent" checked class="w-4 h-4 accent-indigo-600"> 段首空兩格</label>
                    <label class="flex items-center gap-2 bg-white border border-sky-200 rounded px-2 py-2 cursor-pointer"><input type="checkbox" id="optNameLine" checked class="w-4 h-4 accent-indigo-600"> 顯示班級姓名欄</label>
                </div>
                <div class="grid grid-cols-3 gap-2 mt-3 text-xs">
                    <label class="block font-bold text-sky-800">每列生字數
                        <select id="optCols" class="mt-1 w-full p-1.5 border border-sky-300 rounded bg-white font-normal">
                            <option value="3">3 個（大）</option>
                            <option value="4" selected>4 個</option>
                            <option value="5">5 個（小）</option>
                        </select>
                    </label>
                    <label class="block font-bold text-sky-800">句子字級
                        <select id="optFontSize" class="mt-1 w-full p-1.5 border border-sky-300 rounded bg-white font-normal">
                            <option value="8.5" selected>中（8.5 mm）</option>
                            <option value="10">大（10 mm）</option>
                            <option value="12">特大（12 mm）</option>
                        </select>
                    </label>
                    <label class="block font-bold text-sky-800">仿寫格大小
                        <select id="optCellSize" class="mt-1 w-full p-1.5 border border-sky-300 rounded bg-white font-normal">
                            <option value="15">15 mm</option>
                            <option value="18" selected>18 mm</option>
                            <option value="22">22 mm</option>
                        </select>
                    </label>
                </div>
                <label for="titleInput" class="block text-xs font-bold text-sky-800 mt-3 mb-1">學習單標題（留白則用「課次＋生字情境學習單」）</label>
                <input id="titleInput" type="text" class="w-full p-2 border border-sky-300 rounded-md bg-white text-sm">
            </div>

            <!-- 4. 字詞庫順序 -->
            <div class="bg-emerald-50 p-3 rounded-lg border border-emerald-200 shadow-sm">
                <div class="flex items-center justify-between gap-2 mb-2">
                    <label class="block text-sm font-bold text-emerald-900">🔀 4. 字詞庫順序</label>
                    <button type="button" id="btnShuffle" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-1.5 px-3 rounded shadow transition-colors">🔀 重新打亂</button>
                </div>
                <div id="bankPreview" class="kai flex flex-wrap gap-2 text-lg min-h-[2rem]"></div>
            </div>

            <!-- 5. 輸出 -->
            <div class="bg-white p-3 rounded-lg border border-slate-200 shadow-sm">
                <label class="block text-sm font-bold text-slate-800 mb-2">🖨️ 5. 輸出 A4</label>
                <div class="grid grid-cols-2 gap-2">
                    <button type="button" id="btnDownload" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold py-3 rounded shadow transition-colors">⬇ 下載 PNG</button>
                    <button type="button" id="btnPrint" class="bg-slate-800 hover:bg-slate-900 text-white text-sm font-bold py-3 rounded shadow transition-colors">🖨️ 直接列印</button>
                </div>
                <p class="text-[10px] text-slate-500 mt-2 leading-relaxed">A4 300 DPI（2480 × 3508 px），超過一頁會自動分頁。列印時請選：紙張 A4、縮放 100%（實際大小）、邊距無。</p>
            </div>
        </div>
    </div>

    <!-- 右側：預覽 -->
    <div id="previewWrapper" class="flex-1 overflow-y-auto p-4 md:p-6">
        <div class="flex items-center justify-between mb-3">
            <p class="text-sm font-bold text-slate-600">A4 預覽</p>
            <p id="pageInfo" class="text-xs text-slate-500"></p>
        </div>
        <div id="previewPages" class="space-y-6 max-w-[720px] mx-auto"></div>
    </div>

    <script>
        // ==========================================
        // 基本設定（與 HanziBuilder 相同：A4 300 DPI、標楷體）
        // ==========================================
        const PAGE_W = 2480, PAGE_H = 3508;
        const PX_PER_MM = PAGE_W / 210;
        const A_W = 30 * PX_PER_MM; // HanziBuilder 範本的底字格寬，用來換算範本座標
        const FONT_FAMILY = '"BiauKai", "DFKai-SB", "TW-Kai", "KaiTi", "LXGW WenKai TC", serif';
        const UI_FONT = '"Noto Sans TC", sans-serif';
        const MARGIN_X = 16 * PX_PER_MM, MARGIN_TOP = 12 * PX_PER_MM, MARGIN_BOTTOM = 13 * PX_PER_MM;
        const CONTENT_W = PAGE_W - MARGIN_X * 2;

        const COLOR_TEXT = '#1e293b';
        const COLOR_BOX = '#334155';
        const COLOR_HINT = '#c3c9d3';
        const COLOR_GUIDE = '#e2e8f0';
        const COLOR_ANSWER = '#dc2626';
        const COLOR_ACCENT = '#4338ca';
        const PART_COLORS = ['#FF6699', '#4AAEEA', '#00A86B', '#F5A623', '#9B59B6'];

        const DRAFT_KEY = 'clozeWorksheetDraft';
        const DEMO_KEY = 'demo:4上第5課';
        const MANUAL_KEY = 'manual';

            passage: '面對困難時，他從不放棄，總是竭盡全力完成工作。大家都很佩服他，他卻一點也不驕傲。這次地震後，他舉辦義賣活動，把所得全部捐給受災的家庭。'
        };

        // ==========================================

        // ==========================================

林⿰木木 樹⿰木尌 校⿰木交 機⿰木幾 桃⿰木兆 根⿰木艮 板⿰木反 村⿰木寸 杯⿰木不 相⿰木目 樣⿰木羕 橋⿰木喬
河⿰氵可 海⿰氵每 湖⿰氵胡 池⿰氵也 洗⿰氵先 清⿰氵青 波⿰氵皮 沙⿰氵少 活⿰氵舌 江⿰氵工 汗⿰氵干
說⿰言兌 話⿰言舌 語⿰言吾 請⿰言青 讀⿰言賣 謝⿰言射 記⿰言己 詩⿰言寺
吃⿰口乞 叫⿰口丩 唱⿰口昌 吹⿰口欠 吸⿰口及 鳴⿰口鳥
跑⿰足包 跳⿰足兆 路⿰足各 跟⿰足艮 跌⿰足失 踢⿰足易
打⿰扌丁 拍⿰扌白 找⿰扌戈 抱⿰扌包 拉⿰扌立 推⿰扌隹 把⿰扌巴 指⿰扌旨 捐⿰扌肙
眼⿰目艮 睛⿰目青 睡⿰目垂 蝴⿰虫胡 蝶⿰虫枼 蛙⿰虫圭 蛇⿰虫它
紅⿰糸工 給⿰糸合 紙⿰糸氏 線⿰糸泉 鈴⿰金令 錢⿰金戔 飯⿰飠反 餅⿰飠并

雲⿱雨云 雪⿱雨彐 雷⿱雨田 震⿱雨辰 星⿱日生 早⿱日十 晨⿱日辰 景⿱日京 暑⿱日者 最⿱曰取
思⿱田心 想⿱相心 念⿱今心 忘⿱亡心 感⿱咸心 意⿱音心 息⿱自心 您⿱你心 忠⿱中心
李⿱木子 杏⿱木口 呆⿱口木 男⿱田力 岩⿱山石 尖⿱小大 炎⿱火火 多⿱夕夕 吉⿱士口 架⿱加木
買⿱罒貝 賣⿱士買 貨⿱化貝 資⿱次貝 袋⿱代衣 裝⿱壯衣 盒⿱合皿 盆⿱分皿 盤⿱般皿
蛋⿱疋虫 習⿱羽白 皇⿱白王 泉⿱白水 驚⿱敬馬 舉⿱與手
國⿴囗或 園⿴囗袁 圓⿴囗員 回⿴囗口 因⿴囗大 圍⿴囗韋 困⿴囗木
問⿵門口 間⿵門日 開⿵門开 閃⿵門人 聞⿵門耳 閱⿵門兌
這⿺辶言 還⿺辶睘 進⿺辶隹 道⿺辶首 送⿺辶关 過⿺辶咼 遠⿺辶袁 近⿺辶斤 運⿺辶軍 迎⿺辶卬 遊⿺辶斿 速⿺辶束
建⿺廴聿 起⿺走己 趣⿺走取 趕⿺走旱
床⿸广木 店⿸广占 府⿸广付 病⿸疒丙 房⿸戶方 屋⿸尸至
句⿹勹口 包⿹勹巳 區⿷匚品`;
        const BUILTIN_IDS = {};
        BUILTIN_IDS_RAW.trim().split(/\s+/).forEach(entry => {
            const chars = Array.from(entry);
            if (chars.length >= 3) BUILTIN_IDS[chars[0]] = chars.slice(1).join('');
        });
        const IDC = '⿰⿱⿲⿳⿴⿵⿶⿷⿸⿹⿺⿻';
        const NARROW_LEFT = '亻扌氵忄犭礻衤飠彳冫阝口土日目王木女糸金足言虫禾火月子山石米舟馬貝方至甲豕匕立';
        const NARROW_TOP = '艹⺮宀穴雨罒士';

        function parseHintText(text) {
            const chars = Array.from((text || '').replace(/[+＋、,，\s]/g, ''));
            if (!chars.length) return null;
            if (IDC.includes(chars[0]) && chars.length >= 3) return { kind: 'ids', op: chars[0], parts: chars.slice(1) };
            return { kind: 'list', parts: chars };
        }

        // ==========================================
        // 讀取 HanziBuilder 的範本與課次收藏（同網域 localStorage，或匯入的備份檔）
        // ==========================================
        function readJson(key) {
            try { const v = JSON.parse(localStorage.getItem(key) || 'null'); return v && typeof v === 'object' ? v : null; }
            catch (e) { return null; }
        }
        let library = { templates: {}, lessons: {}, source: 'none' };
        let importedLibrary = null; // 匯入的備份只放在記憶體，不覆蓋部件標籤產生器的資料

        function loadLibrary() {
            if (importedLibrary) { library = importedLibrary; return; }
            library = {
                templates: readJson('myCustomStickers') || {},
                lessons: readJson('myLessonCollections') || {},
                source: 'local'
            };
        }

        function templateComps(name) {
            const stored = library.templates[name];
            const comps = Array.isArray(stored) ? stored : (stored && Array.isArray(stored.comps) ? stored.comps : []);
            return comps.filter(c => c && c.active !== false && ((c.type === 'text' && c.char) || (c.type === 'image' && c.imgBase64)));
        }

        // 範本名稱 → 生字（例如「困」或「困(2)」→「困」）
        function charOfName(name) {
            const first = Array.from(String(name).trim())[0] || '';
            return first;
        }

        const imageCache = new Map();
        function loadImage(src) {
            if (imageCache.has(src)) return imageCache.get(src);
            const p = new Promise(resolve => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => resolve(null);
                img.src = src;
            });
            imageCache.set(src, p);
            return p;
        }

        // 每個生字的資料：{ ch, name, parts:[{type,char,color,img}], tpl:[範本部件(含位置)], ids }
        async function buildCharInfo(entry) {
            const info = { ch: entry.ch, name: entry.name || entry.ch, parts: [], tpl: null, ids: null, source: 'none' };
            const comps = entry.name ? templateComps(entry.name) : [];
            if (comps.length) {
                info.source = 'template';
                info.tpl = [];
                for (const c of comps) {
                    const img = c.type === 'image' ? await loadImage(c.imgBase64) : null;
                    if (c.type === 'image' && !img) continue;
                    const comp = { type: c.type, char: c.char, color: c.color || COLOR_TEXT, size: Number(c.size) || 200, x: Number(c.x) || 0, y: Number(c.y) || 0, img };
                    info.tpl.push(comp);
                    info.parts.push(comp);
                }
            }
            if (!info.parts.length) {
                const hint = parseHintText(entry.manual || '') || parseHintText(BUILTIN_IDS[entry.ch] || '');
                if (hint) {
                    info.source = entry.manual ? 'manual' : 'builtin';
                    info.ids = hint;
                    info.parts = hint.parts.map((p, i) => ({ type: 'text', char: p, color: PART_COLORS[i % PART_COLORS.length] }));
                }
            }
            return info;
        }

        // ==========================================
        // 課次清單
        // ==========================================
        function lessonOptions() {
            const opts = [];
            const names = Object.keys(library.lessons || {});
            names.forEach(name => {
                const list = (library.lessons[name] || []).filter(n => library.templates[n]);
                if (list.length) opts.push({ key: 'lesson:' + name, label: `📚 ${name}（${list.length}字）`, name });
            });
            opts.push({ key: DEMO_KEY, label: `🧪 ${DEMO_LESSON.name}` });
            opts.push({ key: MANUAL_KEY, label: '✍️ 手動輸入生字' });
            return opts;
        }

        function parseManualChars(text) {
            const out = [];
            (text || '').split(/\n+/).forEach(line => {
                const t = line.trim();
                if (!t) return;
                const [chPart, partsPart = ''] = t.split(/[=＝:：]/);
                const ch = Array.from(chPart.trim())[0];
                if (ch && !out.some(o => o.ch === ch)) out.push({ ch, manual: partsPart.trim() });
            });
            return out;
        }

        function entriesForLesson(key) {
            if (key.startsWith('lesson:')) {
                const name = key.slice(7);
                const seen = new Set();
                return (library.lessons[name] || []).filter(n => library.templates[n]).map(n => ({ ch: charOfName(n), name: n }))
                    .filter(e => e.ch && !seen.has(e.ch) && seen.add(e.ch));
            }
            if (key === DEMO_KEY) return parseManualChars(DEMO_LESSON.chars);
            return parseManualChars(els.manual.value);
        }

        function lessonDisplayName(key) {
            if (key.startsWith('lesson:')) return key.slice(7);
            if (key === DEMO_KEY) return '4上第5課';
            return '';
        }

        // ==========================================
        // 句子解析：本課生字自動挖空；【】可額外挖空；\字 表示不要挖空
        // ==========================================
        function parsePassage(text, charMap) {
            const paragraphs = [];
            const blanks = [];
            const hintFor = ch => {
                const info = charMap.get(ch);
                if (info) return info.tpl ? { kind: 'template', comps: info.tpl } : info.ids;
                return parseHintText(BUILTIN_IDS[ch] || '');
            };
            const addBlank = (tokens, word) => {
                const blank = { t: 'b', word, chars: Array.from(word).map(ch => ({ ch, hint: hintFor(ch) })) };
                tokens.push(blank); blanks.push(blank);
            };
            text.replace(/\r/g, '').split('\n').forEach(line => {
                if (!line.trim()) { paragraphs.push(null); return; }
                const tokens = [];
                const chars = Array.from(line);
                for (let i = 0; i < chars.length; i++) {
                    const ch = chars[i];
                    if (ch === '\\' && i + 1 < chars.length) { tokens.push({ t: 'c', ch: chars[++i] }); continue; }
                    if (ch === '【') {
                        const end = chars.indexOf('】', i + 1);
                        if (end > i) {
                            const word = chars.slice(i + 1, end).join('').trim();
                            if (word) addBlank(tokens, word);
                            i = end; continue;
                        }
                    }
                    if (charMap.has(ch)) addBlank(tokens, ch);
                    else tokens.push({ t: 'c', ch });
                }
                paragraphs.push(tokens);
            });
            while (paragraphs.length && paragraphs[paragraphs.length - 1] === null) paragraphs.pop();
            while (paragraphs.length && paragraphs[0] === null) paragraphs.shift();
            return { paragraphs, blanks };
        }

        // ==========================================
        // 亂數（可重現的打亂順序）
        // ==========================================
        function mulberry32(a) {
            return function () {
                a |= 0; a = a + 0x6D2B79F5 | 0;
                let t = Math.imul(a ^ a >>> 15, 1 | a);
                t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            };
        }
        function shuffled(list, seed) {
            const rand = mulberry32(seed);
            const arr = list.slice();
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(rand() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }
        function shuffleAwayFromOriginal(list, seed) {
            if (list.length < 2) return list.slice();
            for (let k = 0; k < 20; k++) {
                const out = shuffled(list, seed + k * 7919);
                if (out.some((w, i) => w !== list[i])) return out;
            }
            return list.slice().reverse();
        }

        // ==========================================
        // 畫圖小工具
        // ==========================================
        function kaiFont(px) { return `${Math.round(px)}px ${FONT_FAMILY}`; }

        function drawGlyphInRect(ctx, ch, x, y, w, h) {
            ctx.save();
            ctx.translate(x + w / 2, y + h / 2);
            const size = Math.max(w, h) * 0.92;
            if (w < h) ctx.scale(w / h, 1); else if (h < w) ctx.scale(1, h / w);
            ctx.font = kaiFont(size);
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(ch, 0, size * 0.03);
            ctx.restore();
        }

        // 單一部件畫在方格中央（自動縮放到格內）
        function drawPartInBox(ctx, part, x, y, size, color) {
            const inner = size * 0.84;
            const cx = x + size / 2, cy = y + size / 2;
            ctx.save();
            if (part.type === 'image' && part.img) {
                const r = Math.min(inner / part.img.width, inner / part.img.height);
                const w = part.img.width * r, h = part.img.height * r;
                ctx.drawImage(part.img, cx - w / 2, cy - h / 2, w, h);
            } else {
                ctx.fillStyle = color;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                let fs = inner;
                ctx.font = kaiFont(fs);
                const mw = ctx.measureText(part.char).width;
                if (mw > inner) { fs *= inner / mw; ctx.font = kaiFont(fs); }
                ctx.fillText(part.char, cx, cy + fs * 0.03);
            }
            ctx.restore();
        }

        function idsRects(op, parts) {
            const [a] = parts;
            switch (op) {
                case '⿰': { const lw = NARROW_LEFT.includes(a) ? 0.42 : 0.5; return [[0, 0, lw, 1], [lw, 0, 1 - lw, 1]]; }
                case '⿱': { const th = NARROW_TOP.includes(a) ? 0.36 : 0.48; return [[0, 0, 1, th], [0, th, 1, 1 - th]]; }
                case '⿲': return [[0, 0, 0.33, 1], [0.33, 0, 0.34, 1], [0.67, 0, 0.33, 1]];
                case '⿳': return [[0, 0, 1, 0.33], [0, 0.33, 1, 0.34], [0, 0.67, 1, 0.33]];
                case '⿴': return [[0, 0, 1, 1], [0.27, 0.27, 0.46, 0.46]];
                case '⿵': return [[0, 0, 1, 1], [0.28, 0.38, 0.44, 0.5]];
                case '⿶': return [[0, 0, 1, 1], [0.28, 0.08, 0.44, 0.5]];
                case '⿷': return [[0, 0, 1, 1], [0.32, 0.22, 0.56, 0.56]];
                case '⿸': return [[0, 0, 1, 1], [0.34, 0.34, 0.6, 0.6]];
                case '⿹': return [[0, 0, 1, 1], [0.1, 0.34, 0.56, 0.56]];
                case '⿺': return [[0, 0, 1, 1], [0.36, 0.04, 0.6, 0.62]];
                case '⿻': return [[0, 0, 1, 1], [0, 0, 1, 1]];
                default: return null;
            }
        }

        // 在填空格中畫淡色部件提示：範本照原位置，否則依結構排列
        function drawHint(ctx, hint, x, y, size) {
            if (!hint) return;
            const pad = size * 0.08;
            const ix = x + pad, iy = y + pad, s = size - pad * 2;
            ctx.save();
            ctx.beginPath(); ctx.rect(x + 2, y + 2, size - 4, size - 4); ctx.clip();
            ctx.fillStyle = COLOR_HINT;
            if (hint.kind === 'template') {
                const scale = size / A_W;
                const cx = x + size / 2, cy = y + size / 2;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                hint.comps.forEach(c => {
                    if (c.type === 'image' && c.img) {
                        const h = c.size * scale, w = c.img.width / c.img.height * h;
                        ctx.globalAlpha = 0.28;
                        ctx.drawImage(c.img, cx + c.x * scale - w / 2, cy + c.y * scale - h / 2, w, h);
                        ctx.globalAlpha = 1;
                    } else if (c.char) {
                        ctx.font = kaiFont(c.size * scale);
                        ctx.fillText(c.char, cx + c.x * scale, cy + c.y * scale);
                    }
                });
            } else if (hint.kind === 'ids' && idsRects(hint.op, hint.parts)) {
                const rects = idsRects(hint.op, hint.parts);
                hint.parts.slice(0, rects.length).forEach((p, i) => {
                    const [rx, ry, rw, rh] = rects[i];
                    drawGlyphInRect(ctx, p, ix + rx * s, iy + ry * s, rw * s, rh * s);
                });
            } else if (hint.parts) {
                const parts = hint.parts;
                const cols = parts.length <= 3 ? parts.length : Math.ceil(parts.length / 2);
                const rows = Math.ceil(parts.length / cols);
                const cw = s / cols, chh = s / rows;
                parts.forEach((p, i) => {
                    const r = Math.floor(i / cols), c = i % cols;
                    const cell = Math.min(cw, chh);
                    drawGlyphInRect(ctx, p, ix + c * cw + (cw - cell) / 2, iy + r * chh + (chh - cell) / 2, cell, cell);
                });
            }
            ctx.restore();
        }

        function drawDashedCross(ctx, x, y, size, color, width) {
            ctx.save();
            ctx.strokeStyle = color; ctx.lineWidth = width;
            ctx.setLineDash([size * 0.06, size * 0.05]);
            ctx.beginPath();
            ctx.moveTo(x + size / 2, y); ctx.lineTo(x + size / 2, y + size);
            ctx.moveTo(x, y + size / 2); ctx.lineTo(x + size, y + size / 2);
            ctx.stroke();
            ctx.restore();
        }

        // 田字格（紅框＋虛線十字），與仿寫格同一風格
        function drawTianGrid(ctx, x, y, size) {
            drawDashedCross(ctx, x, y, size, '#fca5a5', 3);
            ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 4;
            ctx.strokeRect(x, y, size, size);
        }

        function roundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
        }

        function sectionHeaderBlock(title, note) {
            const secFs = 6.2 * PX_PER_MM;
            return {
                h: secFs * 2.1, keepWithNext: true,
                draw(ctx, y) {
                    const cy = y + secFs * 1.05;
                    ctx.fillStyle = COLOR_ACCENT;
                    ctx.fillRect(MARGIN_X, cy - secFs * 0.55, 1.6 * PX_PER_MM, secFs * 1.1);
                    ctx.fillStyle = COLOR_TEXT; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
                    ctx.font = kaiFont(secFs);
                    ctx.fillText(title, MARGIN_X + 3.5 * PX_PER_MM, cy);
                    if (note) {
                        const tw = ctx.measureText(title).width;
                        ctx.font = `${Math.round(secFs * 0.6)}px ${UI_FONT}`;
                        ctx.fillStyle = '#64748b';
                        ctx.fillText(note, MARGIN_X + 3.5 * PX_PER_MM + tw + secFs * 0.6, cy + secFs * 0.08);
                    }
                }
            };
        }

        // ==========================================
        // 排版：區塊 → 分頁
        // ==========================================
        const NO_LINE_START = '，。、；：！？」』）》〉…—,.;:!?)]';
        const NO_LINE_END = '「『（《〈([';

        function buildBlocks(state, chars, parsed, measureCtx) {
            const blocks = [];

            // --- 標題 ---
            const titleSize = 9 * PX_PER_MM;
            const nameSize = 5 * PX_PER_MM;
            const headerH = titleSize * 1.5 + (state.nameLine ? nameSize * 2.2 : 0) + 4 * PX_PER_MM;
            blocks.push({
                h: headerH,
                draw(ctx, y) {
                    ctx.fillStyle = COLOR_TEXT;
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.font = kaiFont(titleSize);
                    ctx.fillText(state.title, PAGE_W / 2, y + titleSize * 0.7);
                    let yy = y + titleSize * 1.5;
                    if (state.nameLine) {
                        const fields = [['班級', 22], ['座號', 16], ['姓名', 40]];
                        ctx.font = kaiFont(nameSize);
                        ctx.textAlign = 'left';
                        const totalW = fields.reduce((s, [lbl, w]) => s + ctx.measureText(lbl + '：').width + w * PX_PER_MM + 6 * PX_PER_MM, -6 * PX_PER_MM);
                        let x = PAGE_W - MARGIN_X - totalW;
                        const cy = yy + nameSize * 0.9;
                        ctx.strokeStyle = COLOR_BOX; ctx.lineWidth = 3;
                        fields.forEach(([lbl, w]) => {
                            ctx.fillText(lbl + '：', x, cy);
                            x += ctx.measureText(lbl + '：').width;
                            ctx.beginPath(); ctx.moveTo(x, cy + nameSize * 0.55); ctx.lineTo(x + w * PX_PER_MM, cy + nameSize * 0.55); ctx.stroke();
                            x += w * PX_PER_MM + 6 * PX_PER_MM;
                        });
                        yy += nameSize * 2.2;
                    }
                    ctx.strokeStyle = COLOR_ACCENT; ctx.lineWidth = 5;
                    ctx.beginPath(); ctx.moveTo(MARGIN_X, yy + 1.5 * PX_PER_MM); ctx.lineTo(PAGE_W - MARGIN_X, yy + 1.5 * PX_PER_MM); ctx.stroke();
                }
            });

            // --- 一、看部件，寫生字 ---
            if (chars.length) {
                blocks.push(sectionHeaderBlock('一、看部件，寫生字', '把上面的部件組合起來，寫在下面的格子裡。'));
                const cols = state.cols;
                const gap = 4 * PX_PER_MM;
                const cardW = (CONTENT_W - gap * (cols - 1)) / cols;
                const pad = 3 * PX_PER_MM;
                const plusW = 4.5 * PX_PER_MM;
                // 每張卡片依自己的部件數決定部件格大小；部件列高度固定，讓整排對齊
                const partSizeFor = n => Math.min(15 * PX_PER_MM, (cardW - pad * 2 - plusW * (Math.max(1, n) - 1)) / Math.max(1, n));
                const slotH = Math.max(...chars.map(c => partSizeFor(c.parts.length)));
                const arrowH = 7.5 * PX_PER_MM;
                const writeSize = Math.min(cardW - pad * 2, 28 * PX_PER_MM);
                const cardH = pad + slotH + arrowH + writeSize + pad;
                for (let start = 0; start < chars.length; start += cols) {
                    const row = chars.slice(start, start + cols);
                    blocks.push({
                        h: cardH + gap,
                        draw(ctx, y) {
                            row.forEach((info, i) => {
                                const x = MARGIN_X + i * (cardW + gap);
                                roundRect(ctx, x, y, cardW, cardH, 3 * PX_PER_MM);
                                ctx.fillStyle = '#f8fafc'; ctx.fill();
                                ctx.strokeStyle = '#c7d2fe'; ctx.lineWidth = 4; ctx.stroke();

                                // 部件列
                                const n = info.parts.length;
                                const partSize = partSizeFor(n);
                                const rowW = n * partSize + (n - 1) * plusW;
                                let px = x + (cardW - rowW) / 2;
                                const py = y + pad + (slotH - partSize) / 2;
                                const slotBottom = y + pad + slotH;
                                if (!n) {
                                    ctx.fillStyle = '#94a3b8'; ctx.font = `${Math.round(3.5 * PX_PER_MM)}px ${UI_FONT}`;
                                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                                    ctx.fillText('（尚未設定部件）', x + cardW / 2, y + pad + slotH / 2);
                                }
                                info.parts.forEach((part, pi) => {
                                    roundRect(ctx, px, py, partSize, partSize, partSize * 0.12);
                                    ctx.fillStyle = '#ffffff'; ctx.fill();
                                    ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 3; ctx.stroke();
                                    drawPartInBox(ctx, part, px, py, partSize, state.color ? part.color : COLOR_TEXT);
                                    px += partSize;
                                    if (pi < n - 1) {
                                        ctx.fillStyle = '#64748b'; ctx.font = `${Math.round(plusW * 0.9)}px ${UI_FONT}`;
                                        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                                        ctx.fillText('+', px + plusW / 2, py + partSize / 2);
                                        px += plusW;
                                    }
                                });

                                // 箭頭
                                const ax = x + cardW / 2, ay = slotBottom + arrowH / 2;
                                ctx.strokeStyle = '#60a5fa'; ctx.fillStyle = '#60a5fa'; ctx.lineWidth = 6;
                                ctx.beginPath(); ctx.moveTo(ax, ay - arrowH * 0.32); ctx.lineTo(ax, ay + arrowH * 0.12); ctx.stroke();
                                ctx.beginPath(); ctx.moveTo(ax - arrowH * 0.22, ay + arrowH * 0.05); ctx.lineTo(ax + arrowH * 0.22, ay + arrowH * 0.05); ctx.lineTo(ax, ay + arrowH * 0.35); ctx.closePath(); ctx.fill();

                                // 寫生字格
                                const wx = x + (cardW - writeSize) / 2, wy = slotBottom + arrowH;
                                ctx.fillStyle = '#ffffff'; ctx.fillRect(wx, wy, writeSize, writeSize);
                                drawTianGrid(ctx, wx, wy, writeSize);
                                if (state.answer || state.writeHint) {
                                    ctx.fillStyle = state.answer ? COLOR_ANSWER : COLOR_HINT;
                                    ctx.font = kaiFont(writeSize * 0.8);
                                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                                    ctx.fillText(info.ch, wx + writeSize / 2, wy + writeSize / 2 + writeSize * 0.03);
                                }
                            });
                        }
                    });
                }
            }

            // --- 二、讀句子，填生字 ---
            if (parsed.paragraphs.length) {
                const fs = state.fontMm * PX_PER_MM;
                const box = fs * 1.3;
                const blankGap = fs * 0.12;
                const lineH = box * 1.45;
                const sectionStart = blocks.length;
                blocks.push(sectionHeaderBlock('二、讀句子，填生字', state.showBank && state.bankWords.length
                    ? '從字詞庫選出適當的生字，寫進□裡。' : '想一想，□裡要填哪一個生字？'));

                if (state.showBank && state.bankWords.length) {
                    const itemFs = fs * 0.85;
                    measureCtx.font = kaiFont(itemFs);
                    const padX = itemFs * 0.5, itemH = itemFs * 1.45, gapX = itemFs * 0.45, gapY = itemFs * 0.4;
                    const innerPad = 4 * PX_PER_MM, labelH = 6 * PX_PER_MM;
                    const innerW = CONTENT_W - innerPad * 2;
                    const placed = [];
                    let x = 0, row = 0;
                    state.bankWords.forEach(w => {
                        const iw = Math.max(measureCtx.measureText(w).width + padX * 2, itemH);
                        if (x > 0 && x + iw > innerW) { x = 0; row++; }
                        placed.push({ w, x, row, iw });
                        x += iw + gapX;
                    });
                    const rows = row + 1;
                    const bankH = labelH + innerPad * 0.6 + rows * itemH + (rows - 1) * gapY + innerPad;
                    blocks.push({
                        h: bankH + 4 * PX_PER_MM, keepWithNext: true,
                        draw(ctx, y) {
                            const top = y + labelH / 2;
                            ctx.save();
                            roundRect(ctx, MARGIN_X, top, CONTENT_W, bankH - labelH / 2, 3 * PX_PER_MM);
                            ctx.fillStyle = '#f8fafc'; ctx.fill();
                            ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 4; ctx.setLineDash([18, 12]); ctx.stroke();
                            ctx.restore();
                            const lblFs = 4.8 * PX_PER_MM;
                            ctx.font = kaiFont(lblFs);
                            const lw = ctx.measureText('字詞庫').width + lblFs * 1.2;
                            roundRect(ctx, MARGIN_X + 5 * PX_PER_MM, y, lw, labelH, labelH / 2);
                            ctx.fillStyle = COLOR_ACCENT; ctx.fill();
                            ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                            ctx.fillText('字詞庫', MARGIN_X + 5 * PX_PER_MM + lw / 2, y + labelH / 2 + 2);
                            ctx.font = kaiFont(itemFs);
                            placed.forEach(p => {
                                const ix = MARGIN_X + innerPad + p.x;
                                const iy = y + labelH + innerPad * 0.6 + p.row * (itemH + gapY);
                                roundRect(ctx, ix, iy, p.iw, itemH, itemH * 0.25);
                                ctx.fillStyle = '#ffffff'; ctx.fill();
                                ctx.strokeStyle = COLOR_BOX; ctx.lineWidth = 3; ctx.stroke();
                                ctx.fillStyle = COLOR_TEXT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                                ctx.fillText(p.w, ix + p.iw / 2, iy + itemH / 2 + itemFs * 0.03);
                            });
                        }
                    });
                }

                measureCtx.font = kaiFont(fs);
                const charW = ch => Math.max(measureCtx.measureText(ch).width, /[⺀-￯]/.test(ch) ? fs : 0);
                const tokW = tok => tok.t === 'b' ? tok.chars.length * box + blankGap * 2 : charW(tok.ch);

                parsed.paragraphs.forEach(para => {
                    if (para === null) { blocks.push({ h: lineH * 0.4, draw() {} }); return; }
                    let toks = [];
                    if (state.indent) toks.push({ t: 's', w: fs * 2 });
                    para.forEach(tok => {
                        if (tok.t === 'b' && tokW(tok) > CONTENT_W) tok.chars.forEach(c => toks.push({ t: 'b', word: c.ch, chars: [c] }));
                        else toks.push(tok);
                    });
                    toks = toks.map(tok => ({ ...tok, w: tok.t === 's' ? tok.w : tokW(tok) }));

                    const lines = [];
                    let cur = [], x = 0;
                    toks.forEach(tok => {
                        if (cur.length && x + tok.w > CONTENT_W) {
                            const hang = tok.t === 'c' && NO_LINE_START.includes(tok.ch) && x + tok.w <= CONTENT_W + fs;
                            if (!hang) {
                                const carry = [];
                                const lastTok = cur[cur.length - 1];
                                if (cur.length > 1 && lastTok.t === 'c' && NO_LINE_END.includes(lastTok.ch)) carry.push(cur.pop());
                                lines.push(cur);
                                cur = carry; x = carry.reduce((s, t) => s + t.w, 0);
                            }
                        }
                        cur.push(tok); x += tok.w;
                    });
                    if (cur.length) lines.push(cur);

                    lines.forEach((line, li) => {
                        blocks.push({
                            h: lineH + (li === lines.length - 1 ? fs * 0.2 : 0),
                            draw(ctx, y) {
                                const cy = y + lineH / 2;
                                let x = MARGIN_X;
                                ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
                                line.forEach(tok => {
                                    if (tok.t === 'c') {
                                        ctx.font = kaiFont(fs); ctx.fillStyle = COLOR_TEXT;
                                        ctx.fillText(tok.ch, x, cy + fs * 0.03);
                                    } else if (tok.t === 'b') {
                                        tok.chars.forEach((c, i) => {
                                            const bx = x + blankGap + i * box, by = cy - box / 2;
                                            ctx.fillStyle = '#ffffff'; ctx.fillRect(bx, by, box, box);
                                            if (state.answer) {
                                                ctx.fillStyle = COLOR_ANSWER;
                                                ctx.font = kaiFont(box * 0.78); ctx.textAlign = 'center';
                                                ctx.fillText(c.ch, bx + box / 2, cy + box * 0.03);
                                                ctx.textAlign = 'left';
                                            } else if (state.showHints && c.hint) {
                                                drawHint(ctx, c.hint, bx, by, box);
                                            } else {
                                                drawDashedCross(ctx, bx, by, box, COLOR_GUIDE, 3);
                                            }
                                            ctx.strokeStyle = COLOR_BOX; ctx.lineWidth = 4;
                                            ctx.strokeRect(bx, by, box, box);
                                        });
                                    }
                                    x += tok.w;
                                });
                            }
                        });
                    });
                });

                // 整段句子區盡量放在同一頁
                blocks[sectionStart].groupH = blocks.slice(sectionStart).reduce((sum, b) => sum + b.h, 0);
            }

            // --- 三、仿寫練習 ---
            if (state.showPractice && chars.length) {
                const cell = state.cellMm * PX_PER_MM;
                const cols = Math.max(1, Math.floor(CONTENT_W / cell));
                const gridW = cols * cell;
                const left = MARGIN_X + (CONTENT_W - gridW) / 2;
                blocks.push(sectionHeaderBlock('三、仿寫練習', '先描第一格淡字，再在後面的格子裡練習寫。'));
                chars.forEach(info => {
                    blocks.push({
                        h: cell + cell * 0.18,
                        draw(ctx, y) {
                            for (let c = 0; c < cols; c++) drawDashedCross(ctx, left + c * cell, y, cell, '#fca5a5', 3);
                            ctx.fillStyle = COLOR_HINT;
                            ctx.font = kaiFont(cell * 0.8);
                            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                            ctx.fillText(info.ch, left + cell / 2, y + cell / 2 + cell * 0.03);
                            ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 4;
                            ctx.strokeRect(left, y, gridW, cell);
                            ctx.lineWidth = 3;
                            ctx.beginPath();
                            for (let c = 1; c < cols; c++) { ctx.moveTo(left + c * cell, y); ctx.lineTo(left + c * cell, y + cell); }
                            ctx.stroke();
                        }
                    });
                });
            }
            return blocks;
        }

        function paginate(blocks) {
            const pages = [[]];
            const bottom = PAGE_H - MARGIN_BOTTOM;
            let y = MARGIN_TOP;
            blocks.forEach((b, i) => {
                const page = pages[pages.length - 1];
                let need = b.h;
                if (b.keepWithNext && blocks[i + 1]) need += blocks[i + 1].h;
                if (b.groupH && b.groupH <= bottom - MARGIN_TOP) need = Math.max(need, b.groupH);
                if (y + need > bottom && page.length) { pages.push([]); y = MARGIN_TOP; }
                pages[pages.length - 1].push({ block: b, y });
                y += b.h;
            });
            return pages;
        }

        function renderPages(state, chars, parsed) {
            const measure = document.createElement('canvas').getContext('2d');
            const pages = paginate(buildBlocks(state, chars, parsed, measure));
            return pages.map((items, pi) => {
                const c = document.createElement('canvas');
                c.width = PAGE_W; c.height = PAGE_H;
                const ctx = c.getContext('2d');
                ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, PAGE_W, PAGE_H);
                items.forEach(({ block, y }) => { ctx.save(); block.draw(ctx, y); ctx.restore(); });
                ctx.fillStyle = '#94a3b8';
                ctx.font = `${Math.round(3.2 * PX_PER_MM)}px ${UI_FONT}`;
                ctx.textBaseline = 'middle';
                const fy = PAGE_H - MARGIN_BOTTOM / 2;
                if (state.answer) { ctx.textAlign = 'left'; ctx.fillStyle = COLOR_ANSWER; ctx.fillText('答案版', MARGIN_X, fy); ctx.fillStyle = '#94a3b8'; }
                if (pages.length > 1) { ctx.textAlign = 'right'; ctx.fillText(`第 ${pi + 1} / ${pages.length} 頁`, PAGE_W - MARGIN_X, fy); }
                return c;
            });
        }

        // ==========================================
        // 介面
        // ==========================================
        const $ = id => document.getElementById(id);
        const els = {
            lesson: $('lessonSelect'), manual: $('manualChars'), passage: $('passageInput'), title: $('titleInput'),
            writeHint: $('optWriteHint'), color: $('optColor'), bank: $('optBank'), hints: $('optHints'),
            practice: $('optPractice'), answer: $('optAnswer'), indent: $('optIndent'), nameLine: $('optNameLine'),
            cols: $('optCols'), fontSize: $('optFontSize'), cellSize: $('optCellSize')
        };
        let draft = { passages: {}, excluded: {}, seed: (Date.now() % 2147483647) || 1 };
        let lastCanvases = [];
        let currentKey = '';

        function saveDraft() {
            try {
                draft.lesson = els.lesson.value;
                draft.manual = els.manual.value;
                draft.title = els.title.value;
                draft.opts = {};
                ['writeHint', 'color', 'bank', 'hints', 'practice', 'answer', 'indent', 'nameLine'].forEach(k => draft.opts[k] = els[k].checked);
                ['cols', 'fontSize', 'cellSize'].forEach(k => draft.opts[k] = els[k].value);
                localStorage.setItem(DRAFT_KEY, JSON.stringify(draft));
            } catch (e) { /* 無法保存時忽略 */ }
        }

        function loadDraft() {
            const s = readJson(DRAFT_KEY);
            if (!s || !s.passages) return; // 舊版草稿格式直接略過
            draft = { ...draft, ...s, passages: s.passages || {}, excluded: s.excluded || {} };
            if (typeof s.manual === 'string') els.manual.value = s.manual;
            if (typeof s.title === 'string') els.title.value = s.title;
            const o = s.opts || {};
            ['writeHint', 'color', 'bank', 'hints', 'practice', 'answer', 'indent', 'nameLine'].forEach(k => { if (typeof o[k] === 'boolean') els[k].checked = o[k]; });
            ['cols', 'fontSize', 'cellSize'].forEach(k => { if (o[k] != null && [...els[k].options].some(op => op.value === String(o[k]))) els[k].value = String(o[k]); });
        }

        function fillLessonSelect(preferred) {
            const opts = lessonOptions();
            els.lesson.innerHTML = opts.map(o => `<option value="${escapeHtml(o.key)}">${escapeHtml(o.label)}</option>`).join('');
            const want = [preferred, draft.lesson, currentKey].find(k => k && opts.some(o => o.key === k));
            const firstReal = opts.find(o => o.key.startsWith('lesson:') && o.name !== '未分類') || opts[0];
            els.lesson.value = want || firstReal.key;
            switchLesson();
        }

        function defaultPassage(key) {
            return key === DEMO_KEY ? DEMO_LESSON.passage : '';
        }

        function switchLesson() {
            if (currentKey) draft.passages[currentKey] = els.passage.value;
            currentKey = els.lesson.value;
            els.passage.value = draft.passages[currentKey] ?? defaultPassage(currentKey);
            $('manualBox').classList.toggle('hidden', currentKey !== MANUAL_KEY);
            const src = library.source === 'imported' ? '目前使用匯入的備份檔。' :
                (Object.keys(library.lessons || {}).length ? '已讀取部件標籤產生器的課次收藏。' : '這個瀏覽器還沒有課次收藏，可以先用示範課次或匯入備份檔試用。');
            $('sourceNote').textContent = src;
        }

        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function getState(lessonName) {
            return {
                title: els.title.value.trim() || `${lessonName ? lessonName + ' ' : ''}生字情境學習單`,
                writeHint: els.writeHint.checked, color: els.color.checked, showBank: els.bank.checked,
                showHints: els.hints.checked, showPractice: els.practice.checked, answer: els.answer.checked,
                indent: els.indent.checked, nameLine: els.nameLine.checked,
                cols: parseInt(els.cols.value, 10) || 4, fontMm: parseFloat(els.fontSize.value) || 8.5,
                cellMm: parseFloat(els.cellSize.value) || 18, bankWords: []
            };
        }

        function renderChips(allChars, excluded) {
            $('charChips').innerHTML = allChars.length ? allChars.map(info => {
                const on = !excluded.has(info.ch);
                const parts = info.parts.map(p => p.type === 'image' ? '🖼' : p.char).join('+') || '無部件';
                return `<label class="flex items-center gap-1.5 bg-white border ${on ? 'border-violet-300' : 'border-slate-200 opacity-60'} rounded px-2 py-1 cursor-pointer" title="部件：${escapeHtml(parts)}">
                    <input type="checkbox" data-ch="${escapeHtml(info.ch)}" ${on ? 'checked' : ''} class="w-4 h-4 accent-violet-600">
                    <span class="kai text-lg font-bold text-violet-800">${escapeHtml(info.ch)}</span>
                    <span class="kai text-xs text-slate-500">${escapeHtml(parts)}</span></label>`;
            }).join('') : '<span class="text-xs text-violet-600">（這個課次還沒有生字）</span>';
        }

        function renderCoverage(chars, passage) {
            const plain = passage.replace(/\\./g, '');
            const total = Array.from(passage.replace(/[\s【】\\]/g, '')).length;
            $('passageCount').textContent = `${total} 字`;
            $('coverage').innerHTML = chars.map(info => {
                const used = plain.includes(info.ch);
                return `<span class="kai text-sm border rounded px-2 py-0.5 ${used ? 'bg-emerald-100 border-emerald-300 text-emerald-800' : 'bg-rose-50 border-rose-300 text-rose-700'}">${used ? '✓' : '✗'} ${escapeHtml(info.ch)}</span>`;
            }).join('') + (chars.some(info => !plain.includes(info.ch)) ? '<span class="text-[11px] text-rose-700 self-center">✗ 的生字還沒出現在句子裡</span>' : '');
        }

        async function ensureFonts(text) {
            if (!document.fonts || !document.fonts.load) return;
            const sample = (text || '') + '生字情境學習單班級座號姓名一二三看部件寫讀句子填字詞庫仿寫練習第頁答案版尚未設定' + Object.values(BUILTIN_IDS).join('');
            try {
                await Promise.race([document.fonts.load(`64px "LXGW WenKai TC"`, sample), new Promise(r => setTimeout(r, 2500))]);
            } catch (e) { /* 字型載入失敗時使用本機字型 */ }
        }

        let renderTimer = null, renderToken = 0;
        function scheduleRender(delay = 250) { clearTimeout(renderTimer); renderTimer = setTimeout(render, delay); }

        async function render() {
            const token = ++renderToken;
            const key = els.lesson.value;
            const entries = entriesForLesson(key);
            const allChars = [];
            for (const e of entries) allChars.push(await buildCharInfo(e));
            const excluded = new Set(draft.excluded[key] || []);
            const chars = allChars.filter(c => !excluded.has(c.ch));
            const passage = els.passage.value;
            const state = getState(lessonDisplayName(key));
            await ensureFonts(passage + state.title + allChars.map(c => c.ch + c.parts.map(p => p.char || '').join('')).join(''));
            if (token !== renderToken) return;

            const charMap = new Map(chars.map(c => [c.ch, c]));
            const parsed = parsePassage(passage, charMap);
            const blankWords = [...new Set(parsed.blanks.map(b => b.word))];
            state.bankWords = shuffleAwayFromOriginal(blankWords, draft.seed);

            const canvases = renderPages(state, chars, parsed);
            lastCanvases = canvases;
            const box = $('previewPages');
            box.innerHTML = '';
            canvases.forEach(c => {
                const wrap = document.createElement('div');
                wrap.className = 'page-preview bg-white shadow-2xl';
                const img = document.createElement('canvas');
                img.width = 1240; img.height = 1754;
                img.getContext('2d').drawImage(c, 0, 0, img.width, img.height);
                wrap.appendChild(img);
                box.appendChild(wrap);
            });
            $('pageInfo').textContent = `共 ${canvases.length} 頁・A4 300 DPI`;
            renderChips(allChars, excluded);
            renderCoverage(chars, passage);
            $('bankPreview').innerHTML = state.bankWords.length
                ? state.bankWords.map(w => `<span class="bg-white border border-emerald-300 rounded px-2 py-0.5">${escapeHtml(w)}</span>`).join('')
                : '<span class="text-xs text-emerald-600 font-sans">（句子裡還沒有挖空的生字）</span>';
            draft.passages[key] = passage;
            saveDraft();
        }

        // ---- 事件 ----
        els.lesson.addEventListener('change', () => { switchLesson(); scheduleRender(0); });
        $('charChips').addEventListener('change', e => {
            const ch = e.target.dataset && e.target.dataset.ch;
            if (!ch) return;
            const key = els.lesson.value;
            const set = new Set(draft.excluded[key] || []);
            if (e.target.checked) set.delete(ch); else set.add(ch);
            draft.excluded[key] = [...set];
            scheduleRender(0);
        });
        $('btnShuffle').addEventListener('click', () => {
            draft.seed = (draft.seed * 48271 + 12345) % 2147483647 || 1;
            scheduleRender(0);
        });
        Object.entries(els).forEach(([k, el]) => {
            if (k === 'lesson') return;
            el.addEventListener(el.tagName === 'TEXTAREA' || el.type === 'text' ? 'input' : 'change', () => scheduleRender());
        });

        $('backupFileInput').addEventListener('change', async e => {
            const file = e.target.files && e.target.files[0];
            e.target.value = '';
            if (!file) return;
            try {
                const data = JSON.parse(await file.text());
                if (!data || !data.customTemplates) throw new Error('bad');
                importedLibrary = { templates: data.customTemplates || {}, lessons: data.lessonCollections || {}, source: 'imported' };
                loadLibrary();
                const preferred = data.currentLessonName ? 'lesson:' + data.currentLessonName : '';
                fillLessonSelect(preferred);
                scheduleRender(0);
            } catch (err) {
                $('sourceNote').textContent = '⚠️ 無法讀取這個檔案。請選擇部件標籤產生器「⬇ 匯出備份」產生的 .json 檔。';
            }
        });

        // ---- 輸出 ----
        function stamp() {
            const d = new Date(), p = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`;
        }
        async function freshCanvases() { clearTimeout(renderTimer); await render(); return lastCanvases; }

        $('btnDownload').addEventListener('click', async () => {
            const pages = await freshCanvases();
            const base = getState(lessonDisplayName(els.lesson.value)).title.replace(/[\\/:*?"<>|]/g, '_');
            const suffix = els.answer.checked ? '_答案版' : '';
            pages.forEach((c, i) => {
                setTimeout(() => {
                    const link = document.createElement('a');
                    link.download = pages.length > 1 ? `${base}${suffix}_第${i + 1}頁_${stamp()}.png` : `${base}${suffix}_${stamp()}.png`;
                    link.href = c.toDataURL('image/png');
                    link.click();
                }, i * 400);
            });
        });

        $('btnPrint').addEventListener('click', async () => {
            const pages = await freshCanvases();
            if (!confirm(`即將列印：生字情境學習單\n\n共 ${pages.length} 頁。\n\n請確認：紙張 A4、縮放 100%（實際大小）、邊距 0。`)) return;
            const urls = pages.map(c => c.toDataURL('image/png'));
            let iframe = document.getElementById('printIframe');
            if (!iframe) {
                iframe = document.createElement('iframe');
                iframe.id = 'printIframe';
                iframe.style.cssText = 'position:fixed;top:-9999px;left:-9999px;width:0;height:0;border:none;visibility:hidden;';
                document.body.appendChild(iframe);
            }
            const doc = iframe.contentWindow.document;
            doc.open();
            doc.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>列印 生字情境學習單</title><style>
                @page{size:210mm 297mm;margin:0} html,body{margin:0;padding:0;background:#fff}
                .page{width:210mm;height:297mm;page-break-after:always;position:relative;overflow:hidden}
                .page:last-child{page-break-after:auto}.page img{position:absolute;inset:0;width:210mm;height:297mm;display:block;-webkit-print-color-adjust:exact;print-color-adjust:exact}
            </style></head><body>${urls.map(u => `<div class="page"><img src="${u}"></div>`).join('')}<script>window.addEventListener('load',()=>setTimeout(()=>window.print(),600));<\/script></body></html>`);
            doc.close();
        });

        // 部件標籤產生器在另一個分頁更新範本或課次時，自動同步
        window.addEventListener('storage', e => {
            if (!importedLibrary && (e.key === 'myCustomStickers' || e.key === 'myLessonCollections')) {
                loadLibrary(); fillLessonSelect(els.lesson.value); scheduleRender();
            }
        });

        loadDraft();
        loadLibrary();
        fillLessonSelect();
        render();
    </script>
</body>
</html>
